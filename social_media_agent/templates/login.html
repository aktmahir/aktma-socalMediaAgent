<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - Social Media Post Generator</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f6f8fc; }
      .card { max-width: 420px; margin: 48px auto; padding: 28px; background: #fff; border-radius: 16px; box-shadow: 0 16px 40px rgba(0,0,0,0.05); }
      .field { margin-bottom: 18px; }
      label { display: block; margin-bottom: 8px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 12px 14px; border: 1px solid #d9dde5; border-radius: 10px; font-size: 14px; }
      button { padding: 12px 20px; border: none; border-radius: 10px; background: #3b82f6; color: white; cursor: pointer; font-size: 15px; }
      .error { padding: 14px; border-radius: 12px; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sign in</h1>
      {% if error_message %}
      <p class="error" role="alert">{{ error_message }}</p>
      {% endif %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>

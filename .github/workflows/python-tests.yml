name: Python tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install project
        run: python -m pip install .

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  docker-monitoring:
    runs-on: ubuntu-latest
    env:
      WEB_AUTH_USERNAME: ci-user

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Compose secret
        run: |
          mkdir -p secrets
          printf '%s' 'ci-only-session-secret-value-at-least-32-bytes' > secrets/flask_secret_key.txt
          printf '%s' 'ci-only-browser-password-long-enough' > secrets/web_auth_password.txt
          printf '%s' 'ci-only-metrics-password-long-enough' > secrets/prometheus_password.txt
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.tls.yml config --quiet

      - name: Build and start monitored stack
        run: docker compose up --build --detach

      - name: Verify app scrape and alert rules
        run: |
          docker compose ps --status running --services | grep -qx scheduler
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          expected_rules = {
              "SocialMediaAgentUnavailable",
              "SocialMediaAgentHighServerErrorRate",
              "SocialMediaAgentHighP95Latency",
          }
          deadline = time.monotonic() + 180
          while time.monotonic() < deadline:
              try:
                  with urlopen("http://127.0.0.1:9090/api/v1/targets", timeout=5) as response:
                      targets = json.load(response)["data"]["activeTargets"]
                  app_targets = [
                      target for target in targets
                      if target.get("labels", {}).get("job") == "social-media-agent"
                  ]
                  with urlopen("http://127.0.0.1:9090/api/v1/rules", timeout=5) as response:
                      groups = json.load(response)["data"]["groups"]
                  loaded_rules = {
                      rule["name"]
                      for group in groups
                      for rule in group["rules"]
                  }
                  if app_targets and all(target["health"] == "up" for target in app_targets):
                      missing_rules = expected_rules - loaded_rules
                      if not missing_rules:
                          print("Authenticated app scrape is up; all alert rules are loaded.")
                          break
              except (OSError, KeyError, ValueError):
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Prometheus did not report a healthy app scrape and all alert rules.")
          PY

      - name: Switch to TLS proxy stack
        run: |
          docker compose down
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout secrets/tls.key -out secrets/tls.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build --detach

      - name: Verify TLS, secure cookies, and readiness
        run: |
          python - <<'PY'
          import http.client
          import json
          import ssl
          import time
          from urllib.request import urlopen

          context = ssl._create_unverified_context()
          deadline = time.monotonic() + 180
          while time.monotonic() < deadline:
              try:
                  with urlopen("https://127.0.0.1:8443/ready", context=context, timeout=5) as response:
                      body = json.load(response)
                      if response.status == 200 and body.get("status") == "ready":
                          break
              except (OSError, ValueError):
                  time.sleep(2)
          else:
              raise SystemExit("The TLS-proxied app did not become ready.")

          connection = http.client.HTTPConnection("127.0.0.1", 8080, timeout=5)
          try:
              connection.request("GET", "/health")
              redirect = connection.getresponse()
              location = redirect.getheader("Location", "")
              if redirect.status != 308 or not location.startswith("https://127.0.0.1:8443/"):
                  raise SystemExit("The HTTP listener did not redirect to the published HTTPS port.")
          finally:
              connection.close()

          with urlopen("https://127.0.0.1:8443/login", context=context, timeout=5) as response:
              cookie = response.headers.get("Set-Cookie", "")
              if "Secure" not in cookie or "HttpOnly" not in cookie:
                  raise SystemExit("The TLS login session cookie is missing secure flags.")
          print("TLS proxy, HTTPS redirect, readiness, and secure cookies verified.")
          PY

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.tls.yml logs --no-color

      - name: Stop monitored stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.tls.yml down
